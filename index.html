<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Task Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Kanban Lite</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search tasks...">
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Development">Development</option>
                <option value="Design">Design</option>
            </select>
        </div>
    </header>

    <section class="form-section">
        <form id="taskForm">
            <input type="text" id="taskTitle" required placeholder="Task Title">
            <textarea id="taskDesc" required placeholder="Task Description"></textarea>
            <select id="taskCategory">
                <option value="Development">Development</option>
                <option value="Design">Design</option>
            </select>
            <select id="taskPriority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
            <button type="submit">Add Task</button>
        </form>
    </section>

    <main class="board">
        <div class="column dropzone" data-status="todo" id="col-todo">
            <h2>To Do</h2>
            <div class="task-list" id="list-todo"></div>
        </div>
        <div class="column dropzone" data-status="in-progress" id="col-in-progress">
            <h2>In Progress</h2>
            <div class="task-list" id="list-in-progress"></div>
        </div>
        <div class="column dropzone" data-status="completed" id="col-completed">
            <h2>Completed</h2>
            <div class="task-list" id="list-completed"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
